  Climate/ 目录下的每个 CSV 视为一座城市。逐行一个月：12 个月值 + 键名（首列或末列均可，自动识别）+ 注释列（可省略）；月份表头行会被自动跳过。: Each CSV under Climate/ is one city. One row per month: 12 monthly values + a key (first or last column, auto-detected) + an optional comment column; a month-header row is skipped automatically.
  ID 不能包含斜杠、冒号或句点: ID cannot contain slashes, colons or dots
  res://Localization/<语言>.yaml —— 每个语言一个文件；分组 → 键 → 值（受限 YAML 子集）。ui 组是界面译文：键 = 中文原文: res://Localization/<lang>.yaml — one file per language; group → key → value (restricted YAML subset). The ui group holds UI translations: keys are the Chinese originals.
  · 另有 %d 个未映射键已原样保留: · %d unmapped key(s) kept as-is
  · 跳过 %d 行: · %d row(s) skipped
  · 随机种子分三层（年/月/日），来自城市所属的世界；同一天永远生成同一份天气。: · Randomness is seeded in three tiers (year/month/day) from the city's world; the same day always yields the same weather.
  · 雨日数量按当月「平均降水天数」锁定；非雨日按日照时长分晴/阴；月降水量与月均温向气候表对账（强度见世界设置）。: · Rain days are locked to the month's avg rain days; other days split sunny/cloudy by sunshine; monthly precipitation and mean temperature reconcile toward the climate table (strength in world settings).
  · 顶栏“菜单”里可切换城市、调整时间流速、跳到下一日、恢复现在、打开设置编辑器与偏好设置。: · The Menu at the top switches cities, adjusts time speed, jumps to the next day, resumes now, and opens the settings editor and preferences.
  · 高低温在月均值上叠加确定性波动，并被当月气象记录钳制。: · High/low temperatures add deterministic variation on the monthly means, clamped by the month's records.
