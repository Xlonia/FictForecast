  · 随机种子分三层（年/月/日），来自城市所属的世界；同一天永远生成同一份天气。: · 乱数種は年／月／日の 3 層で、都市の所属世界から導かれます。同じ日は常に同じ天気になります。
  · 雨日数量按当月「平均降水天数」锁定；非雨日按日照时长分晴/阴；月降水量与月均温向气候表对账（强度见世界设置）。: · 雨日の数はその月の「平均降水日数」に固定。雨以外の日は日照時間で晴／曇を分け、月降水量と月平均気温は気候表に合わせます（強度は世界設定）。
  · 顶栏“菜单”里可切换城市、调整时间流速、跳到下一日、恢复现在、打开设置编辑器与偏好设置。: · 上の「メニュー」から都市の切替、時間速度の調整、翌日へ移動、現在へ戻る、設定エディタと環境設定を開けます。
  · 高低温在月均值上叠加确定性波动，并被当月气象记录钳制。: · 最高・最低気温は月平均に決定論的な揺らぎを重ね、その月の記録で抑えられます。
